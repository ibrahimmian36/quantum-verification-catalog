name: Report an inaccuracy
description: Something in an entry is wrong or out of date
title: "[correction] <entry name>"
labels: [correction]
body:
  - type: input
    id: entry
    attributes:
      label: Which entry?
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What is wrong, and what is correct?
      description: Maintainer corrections are applied as-is wherever possible.
    validations:
      required: true
